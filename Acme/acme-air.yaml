apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-web
  namespace: acme-air
spec:
  replicas: 1
  selector:
   matchLabels:
    app: acme-web
  template:
   metadata:
      labels:
       app: acme-web
   spec:
    containers:
    - name: acme-web
      image: yaryorku/acme-experiment-yorku:latest
      env:
       - name: MONGO_PORT_27017_TCP_ADDR
         value: "172.30.5.66"
       - name: MONGO_PORT_27017_TCP_PORT
         value: "27017"
      command: node app.js
---
apiVersion: v1
kind: Service
metadata:
  name: acme-web-service
  namespace: acme-air
spec:
  ports:
  - name: http
    protocol: TCP
    port: 1880
    targetPort: 1880
  selector:
    app: acme-web
